name: Build Caelaris Linux ARM64 Laptop & PC ISO

on:
  workflow_dispatch:
    inputs:
      edition:
        description: 'Desktop Edition to build'
        required: true
        default: 'kde'
        type: choice
        options:
          - kde
          - gnome
  push:
    tags:
      - 'arm64-pc-*'

permissions:
  contents: write

jobs:
  build-arm64-pc:
    runs-on: ubuntu-latest

    steps:
      - name: Free Disk Space
        run: |
          echo "Freeing up runner disk space..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/share/swift
          df -h

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install ARM64 & Image Building Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support parted dosfstools e2fsprogs xorriso xz-utils libarchive-tools squashfs-tools curl mtools

      - name: Build Caelaris Linux ARM64 PC ISO
        run: |
          chmod +x scripts/*.sh
          sudo ./scripts/build_arm64_pc.sh "${{ inputs.edition || 'kde' }}"

      - name: Prepare Release Assets
        id: prep
        run: |
          mkdir -p release_assets
          ISO_FILE=$(ls out-arm64-pc/*.iso | head -n 1)
          ISO_SIZE=$(stat -c%s "$ISO_FILE" 2>/dev/null || stat -f%z "$ISO_FILE")
          ISO_SIZE_HR=$(ls -lh "$ISO_FILE" | awk '{print $5}')
          echo "Processing ISO: $ISO_FILE ($ISO_SIZE bytes, $ISO_SIZE_HR)..."

          # 1. Copy release guides and helper scripts directly from repository
          cp scripts/arm64_release_assets/combine.* release_assets/ 2>/dev/null || true
          cp scripts/arm64_release_assets/QUICKSTART_ARM64_PC.txt release_assets/
          chmod +x release_assets/combine.command release_assets/combine.sh 2>/dev/null || true
          cp scripts/arm64_release_assets/release_notes_arm64.md release_body.md

          # 2. Canonical ISO copy
          cp "$ISO_FILE" "release_assets/caelaris-arm64-pc.iso"

          # 3. Clean relative checksums
          cd release_assets
          sha256sum caelaris-arm64-pc.iso > caelaris-arm64-pc.iso.sha256
          sha256sum caelaris-arm64-pc.iso > SHA256SUMS.txt

          # 4. Only split if file exceeds 1.9GB GitHub asset limit
          if [ "$ISO_SIZE" -gt 1992294400 ]; then
            echo "ISO exceeds 1.9GB. Generating multi-part split for GitHub Release..."
            split -b 1900M -d caelaris-arm64-pc.iso "caelaris-arm64-pc.iso.part-"
            rm -f caelaris-arm64-pc.iso
          else
            echo "ISO size is $ISO_SIZE bytes (< 1.9GB). Standalone ISO uploaded without split."
            rm -f combine.bat combine.command combine.sh
          fi

          cd ..
          ls -lh release_assets/

      - name: Publish GitHub Release (ARM64 Laptops & PCs)
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: arm64-pc-release
          name: Caelaris Linux ARM64 Laptop & PC Edition (Apple Silicon & Snapdragon)
          make_latest: false
          body_path: release_body.md
          files: release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
