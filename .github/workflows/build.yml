name: Build Caelaris Linux ISO

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      edition:
        description: 'Desktop Edition to build'
        required: true
        default: 'kde'
        type: choice
        options:
          - kde
          - gnome

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Free Disk Space (Maximize Build Space)
        run: |
          echo "Freeing up runner disk space..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/share/swift
          df -h

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Caelaris ISO in Arch Linux Container
        run: |
          docker run --privileged --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            archlinux:latest \
            bash -c "
              chmod +x scripts/*.sh &&
              ./scripts/setup_build_env.sh &&
              ./scripts/build.sh ${{ inputs.edition || 'kde' }}
            "

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: caelaris-${{ inputs.edition || 'kde' }}-iso
          path: out/*.iso
          retention-days: 7
