name: Build Caelaris Linux ISO

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'README.md'
      - 'assets/**'
      - 'docs/**'
      - '*.md'
      - '*.txt'
      - '*.pdf'
      - '.gitignore'
      - 'Caelaris Linux Web Page/**'
  workflow_dispatch:
    inputs:
      edition:
        description: 'Desktop Edition to build'
        required: true
        default: 'kde'
        type: choice
        options:
          - kde
          - gnome

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Free Disk Space (Maximize Build Space)
        run: |
          echo "Freeing up runner disk space..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/share/swift
          df -h

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Caelaris ISO in Arch Linux Container
        run: |
          docker run --privileged --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            archlinux:latest \
            bash -c "
              chmod +x scripts/*.sh &&
              ./scripts/setup_build_env.sh &&
              ./scripts/build.sh ${{ inputs.edition || 'kde' }}
            "

      - name: Prepare Release Assets (< 2GB chunks for GitHub Release limit)
        id: prep
        run: |
          mkdir -p release_assets
          ISO_FILE=$(ls out/*.iso | head -n 1)
          ISO_NAME=$(basename "$ISO_FILE")
          echo "Processing $ISO_NAME..."

          # 1. SHA256 Checksum
          sha256sum "$ISO_FILE" > "release_assets/${ISO_NAME}.sha256"

          # 2. Split into 1900MB parts to strictly stay below GitHub's 2147483648-byte limit
          echo "Splitting ISO into parts under 1.9GB..."
          split -b 1900M -d "$ISO_FILE" "release_assets/${ISO_NAME}.part-"

          # 3. Windows 1-click combine script (combine.bat)
          cat << EOF > release_assets/combine.bat
          @echo off
          echo ========================================================
          echo  Merging Caelaris Linux ISO parts...
          echo ========================================================
          copy /b "${ISO_NAME}.part-*" "${ISO_NAME}"
          echo.
          if exist "${ISO_NAME}.sha256" (
              echo Verifying SHA256 checksum...
              certutil -hashfile "${ISO_NAME}" SHA256
          )
          echo.
          echo Done! You can now attach ${ISO_NAME} to VMware or VirtualBox.
          pause
          EOF

          # 4. Attempt direct cloud upload to Pixeldrain for 1-click single-file download
          echo "Attempting Pixeldrain direct upload (5-minute timeout)..."
          PD_URL=""
          PD_RESP=$(curl -s -m 300 -F "file=@$ISO_FILE" https://pixeldrain.com/api/file 2>/dev/null || true)
          PD_ID=$(echo "$PD_RESP" | grep -o '"id":"[^"]*' | cut -d'"' -f4 || true)
          if [ -n "$PD_ID" ]; then
            PD_URL="https://pixeldrain.com/u/$PD_ID"
            echo "Pixeldrain direct download: $PD_URL"
          fi
          echo "PIXELDRAIN_LINK=$PD_URL" >> $GITHUB_ENV

          ls -lh release_assets/

      - name: Clean Previous Release Assets
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Purging old ISO split assets from rolling-release..."
          gh release view rolling-release --json assets -q '.assets[] | select(.name | test("caelaris-kde-.*\\.iso")) | .id' 2>/dev/null | while read -r asset_id; do
            if [ -n "$asset_id" ]; then
              echo "Deleting old asset ID: $asset_id"
              gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$asset_id" || true
            fi
          done || true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: rolling-release
          name: Caelaris Linux Flagship Edition (x64 / x86_64 PC & Laptop)
          make_latest: true
          body: |
            <p align="center">
              <img src="https://raw.githubusercontent.com/kurokai-kun/caelaris-linux/main/assets/logo.png?v=2" alt="Caelaris Linux Logo" width="140">
            </p>

            # Caelaris Linux Flagship Edition (x64 / x86_64)

            Official rolling-release flagship operating system for modern 64-bit (x86_64 / x64) desktop PCs and laptops, featuring a dual-desktop experience (**KDE Plasma 6** and **GNOME 4x**) and pre-tuned low-latency gaming architecture.

            ${{ env.PIXELDRAIN_LINK != '' && format('### ⚡ Direct 1-Click Download (Single 4.2GB ISO):{0}👉 **[Download Caelaris Linux ISO]({1})**{0}{0}---{0}', '\n', env.PIXELDRAIN_LINK) || '' }}

            ---

            ### 📥 How to Download & Assemble Your ISO
            Because GitHub limits individual asset uploads to under 2.0 GB, this flagship ISO (~4.2 GB) is split into 3 parts below:

            1. **Download all 4 files below into the same directory**:
               - `caelaris-kde-*.iso.part-00`
               - `caelaris-kde-*.iso.part-01`
               - `caelaris-kde-*.iso.part-02`
               - `combine.bat` (helper script for Windows)

            2. **Assemble the single ISO file**:
               * **On Windows**:
                 Double-click **`combine.bat`**
                 *(Or open Command Prompt in the download folder and run)*:
                 ```cmd
                 copy /b caelaris-kde-*.iso.part-* caelaris-flagship-x64.iso
                 ```
               * **On macOS / Linux**:
                 Open Terminal in your download folder and run:
                 ```bash
                 cat caelaris-kde-*.iso.part-* > caelaris-flagship-x64.iso
                 ```

            3. **Verify Integrity (Optional)**:
               - Check against `caelaris-kde-*.iso.sha256`.

            4. **Flash to USB & Boot**:
               - Write `caelaris-flagship-x64.iso` to a USB drive using **[Ventoy](https://www.ventoy.net/)** (recommended) or **[Rufus](https://rufus.ie/)** (in DD image mode).
               - Boot into the live environment and click **Install Caelaris Linux** on the desktop!

            ---

            ### 🎨 Dual Desktop Experience
            * **Both KDE Plasma 6 & GNOME 4x Included**: Choose your preferred desktop session directly from the modern SDDM login screen at any time.
            * **Separated Application Menus**: Clean environment isolation ensures KDE utilities stay in Plasma and GNOME tools stay in GNOME with zero duplicate app clutter.
            * **Modern Wayland by Default**: Fractional scaling, smooth animations, and multi-monitor variable refresh rate (VRR).

            ---

            ### ⚡ Ultra-Low Latency & High-Performance Gaming
            * **Competitive Low-Latency Scheduling**: Real-time process dispatching (`rtkit`) and optimized thread preemption.
            * **DirectX 12 / Unreal Engine 5 Tuning**: `vm.max_map_count=2147483642` prevents memory allocation bottlenecks and crashes under Steam Proton/Wine.
            * **Feral GameMode Pre-Integrated**: Automatically boosts CPU and GPU clocks to performance mode when games start.
            * **zstd ZRAM Memory Compression**: Eliminates disk-thrashing hitches during heavy gameplay.
            * **Cutting-Edge Mesa Vulkan Drivers**: ACO shader compiler for AMD, latest Nvidia support, and Wayland direct tearing protocol support.
          files: release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
