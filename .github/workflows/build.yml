name: Build Caelaris Linux ISO

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      edition:
        description: 'Desktop Edition to build'
        required: true
        default: 'kde'
        type: choice
        options:
          - kde
          - gnome

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          chmod +x scripts/*.sh
          ./scripts/setup_build_env.sh

      - name: Build Caelaris ISO (${{ inputs.edition || 'kde' }})
        run: |
          ./scripts/build.sh ${{ inputs.edition || 'kde' }}

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: caelaris-${{ inputs.edition || 'kde' }}-iso
          path: out/*.iso
          retention-days: 7
