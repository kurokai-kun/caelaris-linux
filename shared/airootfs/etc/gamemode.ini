# ==============================================================================
# Caelaris Linux - Feral Interactive GameMode Performance Configuration
# Automatically maximizes CPU and GPU frequencies when games launch
# ==============================================================================

[general]
# The reap frequency in seconds
reaper_freq=5

# The desired CPU governor (performance locks cores to maximum turbo)
desiredgov=performance
igpu_desiredgov=performance

# Automatically adjust process priority (give active games nice priority -10)
renice=10

# Automatically adjust I/O scheduling to real-time / high priority
ioprio=0

# Allow automatic GPU frequency optimization
apply_gpu_optimisations=accept-responsibility

[gpu]
# Apply performance profile to AMD and NVIDIA GPUs
apply_gpu_optimisations=accept-responsibility
gpu_device=0

# NVIDIA: Set performance mode on memory and core clocks
nv_powermode_mclk=2
nv_powermode_core=2

# AMD: Set power profile to compute/3d high performance
amd_performance_level=high

[cpu]
# Prevent CPU core parking during active gameplay
park_cores=no
pin_cores=no
