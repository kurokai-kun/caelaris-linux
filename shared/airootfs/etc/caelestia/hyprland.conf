# ==========================================================
# Caelestia Shell - Hyprland Configuration for Caelaris Linux
# Modern fluid dynamic tiling Wayland interface
# ==========================================================

# ── Monitors ─────────────────────────────────────────────
monitor=,preferred,auto,1

# ── Autostart Daemons, Wallpaper, & Top Bar ──────────────
exec-once = /usr/bin/caelestia-autostart

# ── Input ────────────────────────────────────────────────
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
        tap-to-click = true
        drag_lock = true
    }
}

# ── Misc & Splash Settings ────────────────────────────────
misc {
    disable_hyprland_logo = true
    force_default_wallpaper = 0
    focus_on_activate = true
}

# ── Debug & Warning Suppression ───────────────────────────
debug {
    suppress_errors = true
}

ecosystem {
    no_donation_nag = true
}

# ── General Appearance ────────────────────────────────────
general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    col.active_border = rgb(e07a5f) rgb(f28a6f) 45deg
    col.inactive_border = rgba(60504544)
    layout = dwindle
    allow_tearing = false
}

# ── Decorations, Blur & Glassmorphism ─────────────────────
decoration {
    rounding = 12

    active_opacity = 0.98
    inactive_opacity = 0.90

    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
        xray = false
        ignore_opacity = true
    }

    shadow {
        enabled = true
        range = 15
        render_power = 3
        color = rgba(00000045)
    }
}

# ── Smooth Fluid Animations ───────────────────────────────
animations {
    enabled = true

    bezier = fluid, 0.05, 0.9, 0.1, 1.05
    bezier = overshot, 0.13, 0.99, 0.29, 1.1

    animation = windows, 1, 4, fluid, slide
    animation = windowsOut, 1, 4, fluid, popin 80%
    animation = border, 1, 5, default
    animation = fade, 1, 4, default
    animation = workspaces, 1, 5, overshot, slide
}

# ── Layout: Dwindle ───────────────────────────────────────
dwindle {
    preserve_split = true
}

# ── Window Rules (Hyprland 0.53+ syntax) ──────────────────
windowrule = match:class ^(caelaris-installer-gui)$, float 1
windowrule = match:class ^(caelaris-installer-gui)$, center 1
windowrule = match:class ^(caelestia-dashboard)$, float 1
windowrule = match:class ^(caelestia-dashboard)$, center 1
windowrule = match:class ^(pavucontrol)$, float 1
windowrule = match:class ^(nm-connection-editor)$, float 1
windowrule = match:class ^(blueman-manager)$, float 1
windowrule = match:class ^(org.kde.polkit-kde-authentication-agent-1)$, float 1
windowrule = match:class ^(org.kde.kcalc)$, float 1

# ── Keybindings ───────────────────────────────────────────
$mainMod = SUPER

# Applications
bind = $mainMod, RETURN, exec, konsole || ptyxis || kitty || xterm
bind = $mainMod, Q, exec, konsole || ptyxis || kitty || xterm
bind = $mainMod, E, exec, dolphin || nautilus
bind = $mainMod, SPACE, exec, /usr/bin/caelestia-dashboard || rofi -show drun -theme /etc/caelestia/rofi.rasi
bind = $mainMod, D, exec, rofi -show drun -theme /etc/caelestia/rofi.rasi
bind = $mainMod, S, exec, /usr/bin/caelestia-dashboard

# Installer Trigger (Super + I)
bind = $mainMod, I, exec, caelaris-installer

# Window Management
bind = $mainMod, C, killactive,
bind = $mainMod, W, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, V, togglefloating,
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, J, layoutmsg, togglesplit

# Focus Navigation
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Workspaces Navigation (1-9)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

# Move Active Window to Workspace (1-9)
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

# Mouse Bindings for Floating Windows
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Volume & Multimedia Controls
binde = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
binde = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous

# Screen Brightness Controls
binde = , XF86MonBrightnessUp, exec, brightnessctl set +5% || true
binde = , XF86MonBrightnessDown, exec, brightnessctl set 5%- || true
