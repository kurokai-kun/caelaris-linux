# ==========================================================
# Hyprland Default Configuration for Caelaris Linux
# Pure & Clean Dynamic Tiling Wayland Compositor
# Official documentation: https://wiki.hyprland.org/Configuring/
# ==========================================================

# ── Monitors ─────────────────────────────────────────────
# Default monitor configuration: auto detect resolution and refresh rate
monitor=,preferred,auto,1

# ── Autostart Essential Services ─────────────────────────
# Audio & polkit user services
exec-once = systemctl --user start pipewire pipewire-pulse wireplumber
exec-once = /usr/lib/polkit-kde-authentication-agent-1 || /usr/libexec/polkit-kde-authentication-agent-1
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE

# Network system tray applet
exec-once = nm-applet --indicator

# Default desktop background
exec-once = swaybg -m fill -i /usr/share/backgrounds/caelaris-wallpaper.jpg || swaybg -m fill -i /usr/share/pixmaps/caelaris-logo.png

# Notification daemon
exec-once = dunst

# ── Input ────────────────────────────────────────────────
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
        tap-to-click = true
        drag_lock = true
    }
}

# ── Session & Environment Variables ──────────────────────
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = GDK_BACKEND,wayland,x11,*
env = SDL_VIDEODRIVER,wayland,x11
env = CLUTTER_BACKEND,wayland
env = XCURSOR_THEME,breeze_cursors
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,breeze_cursors
env = HYPRCURSOR_SIZE,24

# ── Cursor & Software Rendering Fallback ──────────────────
cursor {
    no_hardware_cursors = true
    enable_hyprcursor = false
}

# ── Render Settings ───────────────────────────────────────
render {
    direct_scanout = 1
}

# ── Misc & Splash Settings ────────────────────────────────
misc {
    disable_hyprland_logo = false
    disable_splash_rendering = false
    background_color = 0x15172a
    focus_on_activate = true
    vfr = true
}

# ── Debug & Warning Suppression ───────────────────────────
debug {
    suppress_errors = true
}

ecosystem {
    no_donation_nag = true
}

# ── General Appearance ────────────────────────────────────
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    layout = dwindle
    allow_tearing = true
}

# ── Decorations ───────────────────────────────────────────
decoration {
    rounding = 8

    active_opacity = 1.0
    inactive_opacity = 0.95

    blur {
        enabled = true
        size = 5
        passes = 1
        new_optimizations = true
    }

    shadow {
        enabled = true
        range = 8
        render_power = 2
        color = rgba(00000030)
    }
}

# ── Animations ────────────────────────────────────────────
animations {
    enabled = true

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 5, myBezier
    animation = windowsOut, 1, 5, default, popin 80%
    animation = border, 1, 7, default
    animation = fade, 1, 5, default
    animation = workspaces, 1, 5, default
}

# ── Layout: Dwindle ───────────────────────────────────────
dwindle {
    pseudotile = true
    preserve_split = true
}

# ── Window Rules ──────────────────────────────────────────
windowrulev2 = float, class:^(caelaris-installer-gui)$
windowrulev2 = center, class:^(caelaris-installer-gui)$
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = float, class:^(blueman-manager)$
windowrulev2 = float, class:^(org.kde.polkit-kde-authentication-agent-1)$
windowrulev2 = float, class:^(org.kde.kcalc)$

# ── Gaming Performance: Direct Scanout & Uncapped Immediate Presentation ──
windowrulev2 = immediate, class:^(steam_app_.*)$
windowrulev2 = immediate, class:^(gamescope)$
windowrulev2 = immediate, class:^(cs2)$
windowrulev2 = immediate, class:^(dota2)$
windowrulev2 = immediate, class:^(hl2_linux)$
windowrulev2 = immediate, title:^(.*[Gg]ame.*)$

# ── Keybindings ───────────────────────────────────────────
$mainMod = SUPER

# Applications
bind = $mainMod, RETURN, exec, konsole || ptyxis || kitty || xterm
bind = $mainMod, Q, exec, konsole || ptyxis || kitty || xterm
bind = $mainMod, E, exec, dolphin || nautilus
bind = $mainMod, SPACE, exec, rofi -show drun || wofi --show drun
bind = $mainMod, D, exec, rofi -show drun || wofi --show drun

# Installer Trigger (Super + I)
bind = $mainMod, I, exec, caelaris-installer

# Window Management
bind = $mainMod, C, killactive,
bind = $mainMod, W, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, V, togglefloating,
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, P, pseudo,
bind = $mainMod, J, layoutmsg, togglesplit

# Focus Navigation
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Workspaces Navigation (1-9)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

# Move Active Window to Workspace (1-9)
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

# Mouse Bindings for Floating Windows
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Volume & Multimedia Controls
binde = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
binde = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous

# Screen Brightness Controls
binde = , XF86MonBrightnessUp, exec, brightnessctl set +5% || true
binde = , XF86MonBrightnessDown, exec, brightnessctl set 5%- || true
