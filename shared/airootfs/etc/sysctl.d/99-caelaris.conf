# NovaOS Linux - Desktop Performance & Latency Kernel Parameters

# Swap tuning for zram (aggressive swapping to compressed RAM avoids cache dropping)
vm.swappiness = 180
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
vm.page-cluster = 0

# File system cache responsiveness
vm.vfs_cache_pressure = 50

# Networking throughput & congestion control
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# Increase inotify user watches for IDEs, Steam, and desktop file monitors
fs.inotify.max_user_watches = 524288
fs.file-max = 2097152

# Gaming & low latency responsiveness
kernel.sched_cfs_bandwidth_slice_us = 3000
kernel.split_lock_mitigate = 0
