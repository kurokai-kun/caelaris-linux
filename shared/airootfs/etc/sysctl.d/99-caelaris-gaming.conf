# Caelaris Linux - Pro-Grade High-Performance Gaming & Kernel Tuning

# 1. Virtual Memory & Gaming Stability
# Essential for modern gaming (CS2, Unreal Engine 5, Steam Proton, Star Citizen) to avoid crashes
vm.max_map_count = 2147483642

# Low swappiness keeps gaming assets in physical RAM and ZRAM
vm.swappiness = 10

# Maintain VFS directory/inode cache for instant app and game asset loading
vm.vfs_cache_pressure = 50

# Smooth background writeback to prevent I/O stutter
vm.dirty_ratio = 10
vm.dirty_background_ratio = 5

# 2. File Handles & Inotify
fs.file-max = 2097152
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 8192

# 3. Low-Latency Network Gaming (Bufferbloat elimination)
net.core.default_qdisc = cake
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_fastopen = 3
