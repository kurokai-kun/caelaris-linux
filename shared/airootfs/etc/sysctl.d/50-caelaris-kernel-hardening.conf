# ==============================================================================
# Caelaris Linux - Enterprise Kernel Self-Protection & System Hardening
# Protects against rootkits, malware, memory corruption, and network threats
# ==============================================================================

# ── 1. Kernel Information Leaks & Pointer Protection ──────────────────────────
# Restrict dmesg buffer access to processes with CAP_SYSLOG (stops unprivileged malware from reading kernel addresses)
kernel.dmesg_restrict = 1

# Completely hide kernel symbol addresses in /proc/kallsyms (mitigates ROP and privilege escalation exploits)
kernel.kptr_restrict = 2

# ── 2. Memory Corruption & Execution Protections ──────────────────────────────
# Prevent NULL pointer dereference exploits in the kernel
vm.mmap_min_addr = 65536

# Prevent setuid programs from dumping core memory (stops credential scraping)
fs.suid_dumpable = 0

# Randomize memory placement of virtual memory areas (ASLR maximum entropy)
kernel.randomize_va_space = 2

# ── 3. Process Tracing & Injection Defenses (YAMA) ───────────────────────────
# Prevent unprivileged processes from attaching ptrace to other processes (stops memory dumpers & code injectors)
kernel.yama.ptrace_scope = 1

# ── 4. BPF & JIT Hardening ───────────────────────────────────────────────────
# Restrict BPF execution to privileged processes to eliminate speculative execution / side-channel attacks
kernel.unprivileged_bpf_disabled = 1

# Enable constant blinding and hardening on the BPF Just-In-Time compiler
net.core.bpf_jit_harden = 2

# ── 5. Filesystem Symlink & Race Condition Mitigations ───────────────────────
# Disallow following symlinks or hardlinks in world-writable sticky directories (stops /tmp race exploits)
fs.protected_symlinks = 1
fs.protected_hardlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2

# ── 6. Network Stack Spoofing & Denial-of-Service Mitigations ─────────────────
# Enable Reverse Path Filtering on all network interfaces (anti-IP spoofing)
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# Enable TCP SYN Cookie protection against SYN flood DoS attacks
net.ipv4.tcp_syncookies = 1

# Disallow ICMP redirects (prevents MITM route poisoning attacks)
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0

# Ignore source-routed packets
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0

# Log suspicious / spoofed packets
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1

# Ignore broadcast ICMP ping requests (prevents Smurf amplification attacks)
net.ipv4.icmp_echo_ignore_broadcasts = 1

# Protect against bogus ICMP error responses
net.ipv4.icmp_ignore_bogus_error_responses = 1
