# ==============================================================================
# Caelaris Linux - Pro Gaming Process, Thread & Memory Resource Limits
# Eliminates 'Too many open files' crashes in Wine, Proton, Esync, Fsync & native engines
# ==============================================================================

# Maximum open file descriptors (Essential for Esync, Fsync, and heavy asset games)
* soft nofile 1048576
* hard nofile 1048576
root soft nofile 1048576
root hard nofile 1048576

# Unlimited locked memory for low-latency PipeWire / JACK audio and direct memory mapping
* soft memlock unlimited
* hard memlock unlimited
root soft memlock unlimited
root hard memlock unlimited

# Real-time scheduling priority elevation for GameMode and Ananicy-cpp
* soft rtprio 99
* hard rtprio 99
* soft nice -20
* hard nice -20
