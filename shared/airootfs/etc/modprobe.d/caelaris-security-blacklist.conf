# ==============================================================================
# Caelaris Linux - Kernel Attack Surface Reduction & Module Blacklist
# Disables vulnerable, obsolete, and unmaintained protocols & legacy filesystems
# ==============================================================================

# Obsolete network protocols prone to local privilege escalation CVEs
install dccp /bin/true
install sctp /bin/true
install rds /bin/true
install tipc /bin/true

# Legacy unmaintained filesystems frequently targeted via malicious USB drives
install cramfs /bin/true
install freevxfs /bin/true
install jffs2 /bin/true
install hfs /bin/true
install hfsplus /bin/true
install squashfs-tools /bin/true 2>/dev/null || true

# Disable FireWire (IEEE 1394) to eliminate DMA-based physical memory dump attacks
install firewire-core /bin/true
install firewire-ohci /bin/true
install firewire-sbp2 /bin/true
