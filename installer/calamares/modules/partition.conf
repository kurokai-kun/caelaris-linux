# Calamares Partitioning Configuration for NovaOS Linux
# Standardizing on Btrfs with ZSTD compression and modern subvolume layout
---
efiSystemPartition:     "/boot/efi"
efiSystemPartitionSize: 512M

userSwapChoices:
    - none
    - small
    - suspend
    - file

drawNestedPartitions:   false
alwaysShowPartitionLabels: true
initialPartitioningChoice: erase
initialSwapChoice: none
defaultFileSystemType:  "btrfs"

availableFileSystemTypes:
    - btrfs
    - ext4
    - xfs

# Advanced Btrfs Subvolume Topology (Enables Instant Snapper Rollbacks)
btrfsSubvolumes:
    - mountPoint: /
      subvolume: /@
    - mountPoint: /home
      subvolume: /@home
    - mountPoint: /.snapshots
      subvolume: /@snapshots
    - mountPoint: /var/log
      subvolume: /@var_log
    - mountPoint: /var/cache
      subvolume: /@var_cache
