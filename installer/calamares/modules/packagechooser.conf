# Package selection module for Caelaris Linux
---
mode: optional
method: packages

labels:
    step: "Software"

items:
    - id: kde
      name: "KDE Plasma 6 (Default)"
      description: "Modern, feature-rich desktop with Wayland support and Breeze styling."
      packages:
        - plasma-meta
        - sddm
        - dolphin
        - konsole
      selected: true

    - id: gnome
      name: "GNOME Desktop"
      description: "Clean, elegant, distraction-free desktop environment."
      packages:
        - gnome-shell
        - gdm
        - nautilus
        - ptyxis
      selected: false

    - id: thirdparty
      name: "Third-Party Software & Proprietary Codecs"
      description: "Includes proprietary multimedia codecs (FFmpeg, GStreamer), NVIDIA driver utilities, and gaming support (Steam, GameMode)."
      packages:
        - gst-plugins-bad
        - gst-plugins-ugly
        - ffmpeg
        - steam
        - gamemode
      selected: true
